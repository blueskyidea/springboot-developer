#워크플로의 이름 지정
name: CI/CD

#워크플로가 시작될 조건 지정(main 브랜치에 푸시를 할 대마다 워크플로를 시작하도록 설정)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest #실행 환경 지정
    #실행 스텝 지정
    #uses: 지정한 리포지터리를 확인, 코드에 대한 작업 실행.
    #name: 스텝 이름 지정.
    #run: 실행할 명령어 입력.
    steps:
      - uses: actions/checkout@v3  #checkout이라는 작업의 v3버전 실행

      - uses: actions/setup-java@v3
        with:
          #distribution: 'zulu'
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build  #그레들을 사용해 프로젝트를 빌드 이전 상태로 돌리고 다시 빌드하는 명령어

      #현재 시간 가져오기
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

      #배포용 패키지 경로 저장(빌드 이후에 생성된 jar 파일을 찾아 artifact라는 환경 변수에 값을 넣음)
      #GITHUBP_ENV를 사용해 깃허브 워크플로 전체적으로 사용할 수 있는 환경 변수 설정
      - name: Set artifact
        run: echo "artifact=$(ls ./build/libs)" >> $GITHUB_ENV

      #빈스토크 배포
      - name: Beanstalk Deploy
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}  #깃허브 액션에서 가져오는 비밀값(AWS에서 만든 뒤 깃허브에서 설정)
          aws.secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  #깃허브 액션에서 가져오는 비밀값(AWS에서 만든 뒤 깃허브에서 설정)
          application_name: springboot-developer  #AWS 일래스틱 빈스토크에서 확인해서 입력
          environment_name: springboot-developer-env  #AWS 일래스틱 빈스토크에서 확인해서 입력
          version_label: github-action-${{steps.current-time.outputs.formattedTime}}
          region: ap-northeast-2
          deployment_package: ./build/libs/${{env.artifact}}
